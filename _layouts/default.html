<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#20362b">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ '/images/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% if page.hero %}
      <link rel="preload" as="image" href="{{ page.hero.image | relative_url }}"
        {% if page.hero.image_sm %}imagesrcset="{{ page.hero.image_sm | relative_url }} 1200w, {{ page.hero.image | relative_url }} 2400w" imagesizes="100vw"{% endif %}>
    {% endif %}
    <noscript>
      <style>
        .site-header { background: var(--paper); border-bottom: 1px solid var(--line); color: var(--ink); }
      </style>
    </noscript>
    <script>document.documentElement.classList.add('js');</script>
  </head>
  <body class="{% if page.layout == 'home' %}is-home{% endif %}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
