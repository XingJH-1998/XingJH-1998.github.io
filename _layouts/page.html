---
layout: default
---

<header class="page-hero">
  <div class="wrap">
    <p class="eyebrow">{{ page.eyebrow | default: "Page" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </div>
</header>

<section class="section">
  <div class="wrap-narrow prose">
    {{ content }}
  </div>
</section>
